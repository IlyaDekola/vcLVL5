<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>j11n</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#040404;
      --surface:#0b0d10;
      --surface-2:#11141a;
      --border:rgba(255,255,255,.08);
      --text:#f5f7fb;
      --muted:#bcc6d3;
      --sky:#8db7da;
      --avocado:#8baa63;
      --avocado-hover:#799653;
      --silver:#c7d0db;
      --gold:#f5c84b;
      --radius:24px;
      --shadow:0 18px 40px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Manrope',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
    a{text-decoration:none;color:inherit}
    img,svg{display:block;max-width:100%}
    button{font:inherit;border:none;cursor:pointer}
    .page{display:none;min-height:100vh}
    .page.active{display:block}
    .container{width:min(1220px,calc(100% - 40px));margin:0 auto}
    .section{padding:20px 0}
    .header{position:sticky;top:0;z-index:20;background:rgba(4,4,4,.82);backdrop-filter:blur(12px)}
    .header-inner{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
    .logo{display:flex;align-items:center;gap:12px;font-weight:800}
    .logo-mark{width:124px;height:40px}
    .nav-actions{display:flex;gap:12px}
    .btn{min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transition:.2s ease}
    .btn-primary{background:var(--avocado);color:#fff}
    .btn-primary:hover{background:var(--avocado-hover)}
    .btn-secondary{background:#1a1d23;color:#fff;border:1px solid var(--border)}
    
    /* HERO */
    .hero{padding:42px 0 46px}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
    .trust-pill{display:inline-flex;align-items:center;gap:10px;padding:14px 14px;border:1px solid var(--border);background:#0b0e13;border-radius:999px;color:#d2d8e1;font-size:13px;line-height:1;margin-bottom:18px}
    .avatars{display:flex;align-items:center;margin-left:-12px;transform:translateY(1px)}
    .avatars span{width:24px;height:24px;border-radius:50%;border:2px solid #0b0e13;background:linear-gradient(135deg,#d6e6f8,#8db7da);margin-left:-6px;flex:0 0 24px}
    .avatars span:first-child{margin-left:0}
    
    h1{
        font-size: clamp(2.2rem, 7vw, 5.2rem); 
        line-height: 1.0;
        letter-spacing: -0.05em;
        margin-bottom: 20px;
        font-weight: 800;
    }
    h1 .accent{color:var(--sky)}
    
    .hero p{
        font-size: clamp(0.9rem, 2.5vw, 1.2rem); 
        color: #d8dee6;
        max-width: 45ch;
        margin-bottom: 26px;
        line-height: 1.4;
    }
    
    .rating{display:flex;align-items:center;gap:10px;margin-top:24px;color:#d7dde5}
    .stars{color:var(--gold);letter-spacing:-1px;font-size:2.56rem;line-height:1;display:flex;align-items:center}
    .hero-card{background:transparent;border:none;border-radius:0;padding:0;box-shadow:none}
    
    /* ГЕНИЙ С ПРОЗРАЧНЫМИ КРАЯМИ */
    .hero-image {
      aspect-ratio: 4/4.5;
      border-radius: 32px;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      -webkit-mask-image: radial-gradient(circle, black 40%, transparent 95%);
      mask-image: radial-gradient(circle, black 40%, transparent 95%);
    }
    .hero-image::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 30%, var(--bg) 98%);
      pointer-events: none;
    }

    /* ЛОГОТИПЫ */
    .logos-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: clamp(15px, 3vw, 40px);
      opacity: 0.8;
      padding: 10px 0;
    }
    .logos-row div {
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 800;
      color: #818a94;
      text-align: center;
      letter-spacing: -.04em;
      white-space: nowrap;
    }

    /* КАРТОЧКИ КАК ЭТО РАБОТАЕТ */
    .title{font-size:clamp(2.3rem, 4vw, 4rem);line-height:1;letter-spacing:-.04em;text-align:center;margin-bottom:18px;color:var(--silver)}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
    .card{background:#111318;border:1px solid var(--border);border-radius:26px;overflow:hidden}
    
    .card-top {
      height: 240px; 
      background: linear-gradient(180deg,#171b22,#0f1116);
      display: flex;
      align-items: center; 
      justify-content: center;
      padding: 22px;
    }
    
    .card-body{
      padding: 26px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .card-body-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }

    .num {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      font-size: 1.4rem;
      background: var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #111;
      flex-shrink: 0;
    }
    .card h3{font-size:1.8rem;}
    .card p{color:#d1d7df}

    /* ОСТАЛЬНЫЕ СТИЛИ */
    .mini-stack{width:100%;max-width:290px;background:#0c0f14;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px 0}
    .mini-stack div{position:relative;min-height:32px;border-radius:12px;border:none;background:transparent;margin-bottom:10px;display:block;padding:6px 14px 10px 38px;color:#dbe2ea;white-space:nowrap;font-size:.9rem;line-height:1.2}
    .mini-stack div::before{content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:6px;border:1px solid rgba(255,255,255,.22);background:transparent}
    .mini-stack div:nth-child(2){background:linear-gradient(90deg,rgba(121,194,245,.18),rgba(139,170,99,.15));border:1px solid rgba(121,194,245,.24);border-radius:0;width:100%;}
    .mini-stack div:nth-child(2)::before{content:"✔";display:flex;justify-content:center;align-items:center;font-size:11px;color:#0b1118;background:var(--avocado);border:none}
    .job-wrap,.salary-wrap{background:#0d1015;border:1px solid var(--border);border-radius:30px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}
    .job-copy h2,.salary-copy h2{font-size:clamp(2.3rem,4vw,4rem);line-height:.98;letter-spacing:-.04em;margin-bottom:16px;color:var(--silver)}
    .job-copy p,.salary-copy p{color:#d2d9e2;font-size:1.18rem;margin-bottom:24px;max-width:32ch}
    .phone{max-width:430px;margin:0 auto;background:#0a0d12;border:1px solid rgba(255,255,255,.06);border-radius:30px;padding:16px}
    .phone-head{display:flex;justify-content:space-between;margin-bottom:12px;color:#dbe1e7}
    .job-item{background:#10141a;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:10px}
    .job-item strong{display:block;margin-bottom:6px}
    .chips{display:flex;gap:8px;flex-wrap:wrap}.chip
